<section class="card calendar-card" id="calendar" aria-label="Calendar">
    <header class="card-header">
        <h2 class="card-title" id="calendar-title">Calendar</h2>
        <nav class="calendar-nav" aria-label="Calendar navigation">
            <button type="button" id="calendar-previous" aria-label="Previous month">&lsaquo;</button>
            <button type="button" id="calendar-today" aria-label="Back to this month">Today</button>
            <button type="button" id="calendar-next" aria-label="Next month">&rsaquo;</button>
        </nav>
    </header>
    <div class="calendar-grid" id="calendar-grid" role="table" aria-labelledby="calendar-title"></div>
</section>
